name: Sync to public repo

on:
  push:
    branches: [main]

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove private files
        run: |
          rm -f CLAUDE.md PROGRESS.md
          rm -rf .github

      - name: Push to public repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_KEY }}" > ~/.ssh/deploy-key
          chmod 600 ~/.ssh/deploy-key
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/deploy-key -o StrictHostKeyChecking=no"
          git remote add public git@github.com:yoheiocean/dotfiles-public.git
          git add -A
          git commit -m "Sync from private repo" --allow-empty --author="github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
          git push public main --force
