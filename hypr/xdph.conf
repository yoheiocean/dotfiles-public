# Force shared-memory buffers for screencopy instead of DMA-BUF.
# Workaround for a DMA-BUF buffer negotiation bug on Intel UHD 620
# (ThinkPad T480) that causes "Out of buffers" + infinite retry and
# breaks screen sharing in Zoom, OBS, etc.
# On AMD / newer Intel GPUs DMA-BUF works fine — flip to `true` there
# to save CPU during screen share (zero-copy path). SHM is safe on any GPU.
screencopy {
    allow_dma = false
}
