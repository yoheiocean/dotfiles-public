# Minimal Hyprland config — ThinkPad T480 (Intel UHD 620)

monitor = , preferred, auto, 1

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = GTK_THEME,Colloid-Purple-Dark-Gruvbox

# Input method (fcitx5) — only XMODIFIERS needed; GTK/Qt use Wayland IM protocol directly
env = XMODIFIERS,@im=fcitx

$terminal = kitty
$fileManager = kitty -e yazi
$menu = walker --hideqa

input {
    kb_layout = us
    touchpad {
        natural_scroll = true
    }
}

general {
    gaps_in = 3
    gaps_out = 6
    border_size = 3
    col.active_border = rgb(c87533) rgb(2e9ec2) rgb(cc241d) 45deg
    col.inactive_border = rgba(00000000)
    resize_on_border = true
    extend_border_grab_area = 15
}

decoration {
    rounding = 0
    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }
    active_opacity = 0.9
    inactive_opacity = 0.8
    blur {
        enabled = true
        size = 8
        passes = 3
        noise = 0.02
        popups = true
    }
}

animations {
    enabled = yes
}

dwindle {
    preserve_split = true
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
}

# Autostart
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = mako
exec-once = swww-daemon && swww img ~/wallpapers/south-beach.jpg
exec-once = walker --gapplication-service
exec-once = waybar
exec-once = hypridle
exec-once = fcitx5 -d -r --disable notificationitem

# Terminal
bind = SUPER, Return, exec, $terminal

# Close window
bind = SUPER, W, killactive

# Close all windows in active workspace
bind = SUPER, Q, exec, hyprctl clients -j | jq -r --argjson ws "$(hyprctl activeworkspace -j | jq '.id')" '[.[] | select(.workspace.id == $ws) | .address] | .[]' | xargs -I{} hyprctl dispatch closewindow address:{}

# Exit Hyprland
bind = SUPER SHIFT, E, exit

# App launcher
bind = SUPER, Space, exec, $menu

# Command center
bind = SUPER ALT, Space, exec, ~/dotfiles/scripts/commands.sh

# Toggle waybar
bind = SUPER SHIFT, Space, exec, killall -SIGUSR1 waybar

# File manager
bind = SUPER, E, exec, $fileManager

# Move focus
bind = SUPER, H, movefocus, l
bind = SUPER, L, movefocus, r
bind = SUPER, K, movefocus, u
bind = SUPER, J, movefocus, d
bind = SUPER, Left, movefocus, l
bind = SUPER, Right, movefocus, r
bind = SUPER, Up, movefocus, u
bind = SUPER, Down, movefocus, d

# Move window within workspace
bind = SUPER SHIFT, H, movewindow, l
bind = SUPER SHIFT, L, movewindow, r
bind = SUPER SHIFT, K, movewindow, u
bind = SUPER SHIFT, J, movewindow, d
bind = SUPER SHIFT, Left, movewindow, l
bind = SUPER SHIFT, Right, movewindow, r
bind = SUPER SHIFT, Up, movewindow, u
bind = SUPER SHIFT, Down, movewindow, d

# Workspaces
bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5

# Move window to workspace
bind = SUPER SHIFT, 1, movetoworkspace, 1
bind = SUPER SHIFT, 2, movetoworkspace, 2
bind = SUPER SHIFT, 3, movetoworkspace, 3
bind = SUPER SHIFT, 4, movetoworkspace, 4
bind = SUPER SHIFT, 5, movetoworkspace, 5

# Scratchpad
bind = SUPER, S, togglespecialworkspace, magic
bind = SUPER SHIFT, S, movetoworkspace, special:magic

# Toggle fullscreen / floating / split
bind = SUPER, F, fullscreen
bind = SUPER, T, togglefloating
bind = SUPER, I, layoutmsg, togglesplit

# Resize window with keyboard
binde = SUPER, equal, resizeactive, 40 0
binde = SUPER, minus, resizeactive, -40 0
binde = SUPER SHIFT, equal, resizeactive, 0 -40
binde = SUPER SHIFT, minus, resizeactive, 0 40

# Toggle input method (EN/JP)
bind = SUPER, grave, exec, fcitx5-remote -t

# Wallpaper
bind = SUPER, P, exec, kitty --title awtwall awtwall
bind = SUPER SHIFT, P, exec, ~/dotfiles/scripts/cycle-wallpaper.sh

# Browser
bind = SUPER, B, exec, brave

# Move/resize with mouse
bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow

# Volume
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

# Brightness
bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

# Screenshot
bind = , Print, exec, hyprshot -m output
bind = SUPER, Print, exec, hyprshot -m window
bind = SUPER SHIFT, Print, exec, hyprshot -m region

# Media
bindl = ,XF86AudioNext, exec, playerctl next
bindl = ,XF86AudioPause, exec, playerctl play-pause
bindl = ,XF86AudioPlay, exec, playerctl play-pause
bindl = ,XF86AudioPrev, exec, playerctl previous

# Layer rules — blur behind Walker launcher
layerrule {
    name = walker-blur
    blur = on
    ignore_alpha = 0.2
    match:namespace = walker
}

# Layer rules — blur behind mako notifications
layerrule {
    name = mako-blur
    blur = on
    ignore_alpha = 0
    match:namespace = notifications
}

# Window rules
windowrule {
    name = fastfetch-float
    match:title = ^fastfetch$
    float = true
    size = 1080 720
    center = true
}

windowrule {
    name = tclock-float
    match:title = ^tclock$
    float = true
    size = 600 220
    center = true
}

windowrule {
    name = btop-float
    match:title = ^btop$
    float = true
    size = 1080 720
    center = true
}

windowrule {
    name = bluetui-float
    match:title = ^bluetui$
    float = true
    size = 900 600
    center = true
}

windowrule {
    name = impala-float
    match:title = ^impala$
    float = true
    size = 900 600
    center = true
}

windowrule {
    name = calcure-float
    match:title = ^calcure$
    float = true
    size = 900 600
    center = true
}

windowrule {
    name = wiremix-float
    match:title = ^wiremix$
    float = true
    size = 900 600
    center = true
}

windowrule {
    name = duf-float
    match:title = ^duf-disk-usage$
    float = true
    size = 1280 860
    center = true
}

windowrule {
    name = awtwall-float
    match:title = ^awtwall$
    float = true
    size = 1280 860
    center = true
}

windowrule {
    name = pacsea-float
    match:title = ^pacsea$
    float = true
    size = 1280 860
    center = true
}

windowrule {
    name = add-webapp-float
    match:title = ^add-webapp$
    float = true
    size = 600 160
    center = true
}

windowrule {
    name = add-termapp-float
    match:title = ^add-termapp$
    float = true
    size = 600 160
    center = true
}

windowrule {
    name = add-vpn-float
    match:title = ^add-vpn$
    float = true
    size = 600 160
    center = true
}

windowrule {
    name = tte-screensaver
    match:title = ^tte-screensaver$
    fullscreen = true
    float = true
}

windowrule {
    name = suppress-maximize-events
    match:class = .*
    suppress_event = maximize
}

windowrule {
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false
    no_focus = true
}
