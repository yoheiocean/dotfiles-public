# Pacsea theme — Popping and Locking (matches kitty/starship/waybar palette)
#
# Based on Gruvbox Dark with background from Popping and Locking kitty theme.
# Format: key = #RRGGBB

# Background layers (from darkest to lightest)
background_base = #181921
background_mantle = #1d2021
background_crust = #0d1011

# Component surfaces
surface_level1 = #3c3836
surface_level2 = #504945

# Low-contrast lines/borders
overlay_primary = #665c54
overlay_secondary = #928374

# Text hierarchy
text_primary = #ebdbb2
text_secondary = #a89984
text_tertiary = #bdae93

# Accents and semantic colors
accent_interactive = #458588
accent_heading = #b16286
accent_emphasis = #d3869b
semantic_success = #b8bb26
semantic_warning = #fabd2f
semantic_error = #cc241d
